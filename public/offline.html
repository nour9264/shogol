<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - SHOGOL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .retry-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .features {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .features h2 {
            font-size: 20px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .feature-list {
            list-style: none;
            text-align: right;
        }

        .feature-list li {
            padding: 10px 0;
            opacity: 0.8;
            font-size: 16px;
        }

        .feature-list li::before {
            content: "✓ ";
            margin-left: 10px;
            font-weight: bold;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon pulse">
            📡
        </div>
        <h1>غير متصل بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالإنترنت حالياً. بعض الميزات قد لا تكون متاحة.</p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            إعادة المحاولة
        </button>

        <div class="features">
            <h2>الصفحات المتاحة دون اتصال:</h2>
            <ul class="feature-list">
                <li>الصفحات التي زرتها مسبقاً</li>
                <li>معلومات ملفك الشخصي</li>
                <li>المحادثات المحفوظة</li>
                <li>الإشعارات السابقة</li>
            </ul>
        </div>
    </div>

    <script>
        // Check connection status every 3 seconds
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 3000);

        // Listen for online event
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
